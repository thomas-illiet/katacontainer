<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Fail-closed startup sequence</title><desc id="desc">The guard validates and attaches every program before creating the ready signal and allowing code-server to start.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.t{font:700 26px system-ui,sans-serif;fill:#0f172a}.h{font:600 17px system-ui,sans-serif;fill:#0f172a}.x{font:14px system-ui,sans-serif;fill:#334155}.life{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 7}.msg{stroke:#334155;stroke-width:2;marker-end:url(#a)}.ok{fill:#dcfce7;stroke:#16a34a}.bad{fill:#fee2e2;stroke:#dc2626}.box{stroke-width:2;rx:12}</style></defs>
  <rect width="1200" height="700" fill="#f8fafc"/><text x="45" y="48" class="t">Fail-closed startup</text>
  <text x="120" y="100" class="h">Kubernetes</text><text x="475" y="100" class="h">guard</text><text x="865" y="100" class="h">code-server</text>
  <line x1="170" y1="120" x2="170" y2="650" class="life"/><line x1="510" y1="120" x2="510" y2="650" class="life"/><line x1="910" y1="120" x2="910" y2="650" class="life"/>
  <line x1="170" y1="150" x2="500" y2="150" class="msg"/><text x="260" y="140" class="x">start privileged container</text>
  <rect x="390" y="180" width="240" height="48" class="box ok"/><text x="423" y="210" class="x">Validate policy + cgroup</text><rect x="390" y="250" width="240" height="48" class="box ok"/><text x="425" y="280" class="x">Load and freeze maps</text><rect x="390" y="320" width="240" height="48" class="box ok"/><text x="420" y="350" class="x">Attach and pin 5 links</text>
  <line x1="510" y1="395" x2="900" y2="395" class="msg"/><text x="605" y="385" class="x">create /run/kata-egress-guard/ready</text><rect x="790" y="425" width="240" height="48" class="box ok"/><text x="832" y="455" class="x">Start code-server</text><line x1="910" y1="500" x2="1180" y2="500" class="msg"/><text x="965" y="490" class="x">HTTP service ready</text>
  <path d="M390 204 H300 V560 H500" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/><rect x="390" y="545" width="240" height="65" class="box bad"/><text x="418" y="573" class="h">Any error</text><text x="410" y="596" class="x">no ready signal, exit 1</text><line x1="630" y1="578" x2="900" y2="578" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 5"/><text x="678" y="568" class="x">code-server remains blocked</text>
</svg>
