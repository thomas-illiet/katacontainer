<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Egress decision tree</title><desc id="desc">The guard decision based on address family, protocol, loopback, and destination allowlist matching.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.t{font:700 26px system-ui,sans-serif;fill:#0f172a}.h{font:600 16px system-ui,sans-serif;fill:#0f172a}.x{font:14px system-ui,sans-serif;fill:#334155}.box{stroke-width:2;rx:14}.line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}.yes{fill:#dcfce7;stroke:#16a34a}.no{fill:#fee2e2;stroke:#dc2626}.q{fill:#eff6ff;stroke:#2563eb}.local{fill:#fefce8;stroke:#ca8a04}</style></defs>
  <rect width="1200" height="760" fill="#f8fafc"/><text x="45" y="48" class="t">Network operation decision</text>
  <rect x="430" y="80" width="340" height="60" class="box q"/><text x="475" y="116" class="h">Create or send through a socket</text><rect x="430" y="185" width="340" height="60" class="box q"/><text x="485" y="221" class="h">AF_INET / AF_INET6 family?</text><path d="M600 140 V185" class="line"/>
  <rect x="60" y="290" width="280" height="60" class="box local"/><text x="115" y="326" class="h">No: allow local socket</text><path d="M430 215 H200 V290" class="line"/><text x="250" y="205" class="x">no</text>
  <rect x="460" y="290" width="280" height="60" class="box q"/><text x="505" y="326" class="h">Standard TCP or UDP?</text><path d="M600 245 V290" class="line"/><text x="612" y="270" class="x">yes</text>
  <rect x="860" y="290" width="280" height="60" class="box no"/><text x="910" y="317" class="h">Deny protocol</text><text x="900" y="338" class="x">ICMP, raw, SCTP…</text><path d="M740 320 H860" class="line"/><text x="785" y="310" class="x">no</text>
  <rect x="460" y="395" width="280" height="60" class="box q"/><text x="505" y="431" class="h">Loopback destination?</text><path d="M600 350 V395" class="line"/><text x="612" y="375" class="x">yes</text>
  <rect x="60" y="500" width="280" height="60" class="box yes"/><text x="120" y="536" class="h">Allow local traffic</text><path d="M460 425 H200 V500" class="line"/><text x="255" y="415" class="x">yes</text>
  <rect x="460" y="500" width="280" height="75" class="box q"/><text x="493" y="528" class="h">Matching LPM trie entry:</text><text x="488" y="552" class="x">protocol + port + CIDR?</text><path d="M600 455 V500" class="line"/><text x="612" y="480" class="x">no</text>
  <rect x="230" y="650" width="280" height="60" class="box yes"/><text x="275" y="686" class="h">Allow + increment counter</text><path d="M520 575 V620 H370 V650" class="line"/><text x="420" y="610" class="x">match</text>
  <rect x="690" y="650" width="280" height="60" class="box no"/><text x="735" y="686" class="h">Deny + increment counter</text><path d="M680 575 V620 H830 V650" class="line"/><text x="737" y="610" class="x">no rule</text>
</svg>
