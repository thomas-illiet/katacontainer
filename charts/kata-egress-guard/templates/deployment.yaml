apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kata-egress-guard.fullname" . }}
  labels:
    {{- include "kata-egress-guard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kata-egress-guard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/policy: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
      labels:
        {{- include "kata-egress-guard.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      runtimeClassName: {{ .Values.runtimeClassName | quote }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: {{ .Values.codeServer.gid }}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: guard
          image: {{ include "kata-egress-guard.image" .Values.guard.image | quote }}
          imagePullPolicy: {{ .Values.guard.image.pullPolicy }}
          args:
            - --listen={{ ternary (printf "0.0.0.0:%v" .Values.guard.metrics.port) (printf "127.0.0.1:%v" .Values.guard.metrics.port) .Values.serviceMonitor.enabled }}
          env:
            - name: KATA_EGRESS_GUARD_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: KATA_EGRESS_GUARD_LOG_LEVEL
              value: {{ .Values.guard.logLevel | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.guard.metrics.port }}
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: true
            seccompProfile:
              type: Unconfined
          readinessProbe:
            exec:
              command: ["/kata-egress-guard", "healthcheck", "--ready-file=/run/kata-egress-guard/ready"]
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/kata-egress-guard", "healthcheck", "--ready-file=/run/kata-egress-guard/ready"]
            periodSeconds: 15
            failureThreshold: 3
          resources: {{ toYaml .Values.guard.resources | nindent 12 }}
          volumeMounts:
            - {name: policy, mountPath: /etc/kata-egress-guard, readOnly: true}
            - {name: ready, mountPath: /run/kata-egress-guard}
        - name: code-server
          image: {{ include "kata-egress-guard.image" .Values.codeServer.image | quote }}
          imagePullPolicy: {{ .Values.codeServer.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until [ -r /run/kata-egress-guard/ready ]; do sleep 1; done
              exec code-server --bind-addr 0.0.0.0:{{ .Values.codeServer.port }} --auth password /home/coder/project
          env:
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.codeServer.existingSecret }}
                  key: {{ .Values.codeServer.passwordKey }}
          ports:
            - {name: http, containerPort: {{ .Values.codeServer.port }}}
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.codeServer.uid }}
            runAsGroup: {{ .Values.codeServer.gid }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 15
          resources: {{ toYaml .Values.codeServer.resources | nindent 12 }}
          volumeMounts:
            - {name: ready, mountPath: /run/kata-egress-guard, readOnly: true}
            - {name: home, mountPath: /home/coder}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: policy
          configMap: {name: {{ include "kata-egress-guard.fullname" . }}-policy}
        - name: ready
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
