{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kata-egress-guard.fullname" . }}
  labels:
    {{- include "kata-egress-guard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kata-egress-guard.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
  {{- range .Values.policy.egress }}
    {{- $rule := . }}
    {{- range .cidrs }}
    - to:
        - ipBlock: {cidr: {{ . | quote }}}
      ports:
        {{- range $rule.ports }}
        - {protocol: {{ $rule.protocol }}, port: {{ . }}}
        {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
