apiVersion: v1
kind: Service
metadata:
  name: {{ include "kata-egress-guard.fullname" . }}
  labels:
    {{- include "kata-egress-guard.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "kata-egress-guard.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- if .Values.serviceMonitor.enabled }}
    - name: metrics
      port: {{ .Values.guard.metrics.port }}
      targetPort: metrics
{{- end }}
